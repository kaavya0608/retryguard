# Containerised version of the demo:  docker compose up --build
#   gateway    http://localhost:8100   (POLICY=retryguard | baseline)
#   backend    http://localhost:8101
#   prometheus http://localhost:9090
services:
  backend:
    build: .
    command: uvicorn services.backend:app --host 0.0.0.0 --port 8101 --log-level warning
    environment:
      WORKERS: "4"
      SERVICE_TIME: "0.04"
      MAX_QUEUE: "100"
    ports: ["8101:8101"]

  gateway:
    build: .
    command: uvicorn services.gateway:app --host 0.0.0.0 --port 8100 --log-level warning
    environment:
      POLICY: ${POLICY:-retryguard}
      BACKEND_URL: http://backend:8101
    depends_on: [backend]
    ports: ["8100:8100"]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [gateway, backend]
